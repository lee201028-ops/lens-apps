<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<title>Navarre Pier — Tide + Weather</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#000; color:#fff; height:100%; overflow:hidden; }
  body {
    font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:18px 20px 14px; width:600px; height:600px; overflow:hidden; margin:0 auto;
    -webkit-font-smoothing:antialiased;
  }
  .hdr { text-align:center; }
  .hdr h1 { font-size:24px; letter-spacing:3px; color:#7fd4ff; font-weight:700; }
  .hdr .asof { font-size:16px; color:#888; margin-top:2px; }
  .tide { text-align:center; margin-top:8px; }
  .tide .dir { font-size:26px; font-weight:700; letter-spacing:1px; }
  .tide .dir.up { color:#3dff7a; }
  .tide .dir.down { color:#ff9d3d; }
  .tide .h { font-size:64px; font-weight:800; line-height:1.05; }
  .tide .h small { font-size:26px; font-weight:600; color:#aaa; }
  .next { display:flex; gap:14px; justify-content:center; margin-top:8px; width:100%; }
  .next .box {
    flex:1; border:2px solid #2a2a2a; border-radius:12px; padding:8px 6px; text-align:center;
  }
  .next .lbl { font-size:15px; color:#999; letter-spacing:2px; }
  .next .val { font-size:34px; font-weight:800; }
  .next .val small { font-size:18px; color:#aaa; }
  .next .tm { font-size:21px; color:#7fd4ff; }
  .grid {
    display:grid; grid-template-columns:1fr 1fr; gap:6px 18px;
    width:100%; margin-top:10px;
  }
  .cell { display:flex; justify-content:space-between; align-items:baseline;
    border-top:1px solid #222; padding:7px 2px; font-size:24px; }
  .cell .k { color:#999; font-size:20px; }
  .cell .v { font-weight:700; }
  .flagbtn {
    display:block; width:100%; margin-top:12px; padding:16px;
    background:#0a84ff; color:#fff; border:none; border-radius:14px;
    font-size:28px; font-weight:800; text-align:center; text-decoration:none;
    cursor:pointer;
  }
  .flagbtn:focus, .flagbtn:focus-visible { outline:5px solid #ffd60a; outline-offset:3px; }
  .flagbtn .sub { display:block; font-size:17px; font-weight:400; opacity:.85; margin-top:2px; }
  .err {
    width:100%; text-align:center; color:#ff6b6b; font-size:20px;
    border:2px solid #5a1f1f; border-radius:10px; padding:10px; margin-top:10px;
  }
</style>
</head>
<body>
  <div class="hdr">
    <h1>NAVARRE PIER</h1>
    <div class="asof" id="asof">loading…</div>
  </div>

  <div class="tide">
    <div class="dir" id="tideDir">—</div>
    <div class="h"><span id="tideH">–</span><small> ft</small></div>
  </div>

  <div class="next">
    <div class="box">
      <div class="lbl">NEXT HIGH</div>
      <div class="val"><span id="nextHighV">–</span><small> ft</small></div>
      <div class="tm" id="nextHighT">–</div>
    </div>
    <div class="box">
      <div class="lbl">NEXT LOW</div>
      <div class="val"><span id="nextLowV">–</span><small> ft</small></div>
      <div class="tm" id="nextLowT">–</div>
    </div>
  </div>

  <div class="grid">
    <div class="cell"><span class="k">Air</span><span class="v" id="airT">–</span></div>
    <div class="cell"><span class="k">Wind</span><span class="v" id="wind">–</span></div>
    <div class="cell"><span class="k">Waves</span><span class="v" id="waves">–</span></div>
    <div class="cell"><span class="k">Water</span><span class="v" id="waterT">–</span></div>
    <div class="cell"><span class="k">Sky</span><span class="v" id="sky">–</span></div>
    <div class="cell"><span class="k">Sun</span><span class="v" id="sun">–</span></div>
  </div>

  <a class="flagbtn" id="flagBtn" href="https://www.santarosa.fl.gov">
    Check today's beach flag
    <span class="sub">official Santa Rosa County conditions</span>
  </a>

  <div id="errBox" style="width:100%"></div>

<script>
(function(){
  "use strict";
  var STATION = "8729678", LAT = 30.38, LON = -86.86, TZ = "America/Chicago";

  function $(id){ return document.getElementById(id); }
  function pad(n){ return String(n).padStart(2,"0"); }
  function ymd(d){ return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()); }
  function fmt12(hm){
    var p = hm.split(":"), h = +p[0], m = p[1], ap = h >= 12 ? "PM" : "AM";
    h = h % 12; if (h === 0) h = 12;
    return h + ":" + m + " " + ap;
  }
  function nowChicago(){
    var s = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",
      day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date());
    return s.replace(", "," ");
  }
  function compass(deg){
    var dirs=["N","NE","E","SE","S","SW","W","NW"];
    return dirs[Math.round(deg/45)%8];
  }
  var WMO={0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Icy fog",
    51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",
    80:"Light showers",81:"Showers",82:"Heavy showers",
    95:"Thunderstorm",96:"Storm + hail",99:"Storm + hail"};
  function fail(msg){
    $("errBox").innerHTML='<div class="err">'+msg+'</div>';
  }

  // D-pad navigation is owned by the glasses' browser (spatial navigation):
  // arrow keys move between controls, Enter activates. No custom handlers.

  function loadTide(){
    var t=new Date(), e=new Date(t.getTime()+2*864e5);
    var url="https://api.tidesandcurrents.noaa.gov/api/prod/datagetter"+
      "?begin_date="+ymd(t)+"&end_date="+ymd(e)+"&station="+STATION+
      "&product=predictions&datum=MLLW&time_zone=lst_ldt&units=english&interval=6&format=json";
    return fetch(url).then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){
      var pts=(d.predictions||[]).map(function(p){ return { t:p.t, v:parseFloat(p.v) }; });
      if(pts.length<3) throw 0;
      var nowS=nowChicago().slice(0,16);
      var i=0;
      while(i<pts.length-1 && pts[i+1].t.slice(0,16)<=nowS) i++;
      var a=pts[i], b=pts[i+1]||a, h;
      if(b===a){ h=a.v; }
      else{
        var tA=Date.parse(a.t.replace(" ","T")+":00"),
            tB=Date.parse(b.t.replace(" ","T")+":00"),
            tN=Date.parse(nowS.replace(" ","T")+":00"),
            f=Math.min(1,Math.max(0,(tN-tA)/Math.max(1,(tB-tA))));
        h=a.v+(b.v-a.v)*f;
      }
      var rising=(b.v-a.v)>=0;
      $("tideH").textContent=h.toFixed(1);
      var dir=$("tideDir");
      dir.textContent=rising?"▲ RISING":"▼ FALLING";
      dir.className="dir "+(rising?"up":"down");
      var nextHigh=null,nextLow=null;
      for(var k=1;k<pts.length-1;k++){
        var p0=pts[k-1].v,p1=pts[k].v,p2=pts[k+1].v;
        if(pts[k].t.slice(0,16)>nowS){
          if(p1>p0&&p1>=p2&&!nextHigh) nextHigh=pts[k];
          if(p1<p0&&p1<=p2&&!nextLow) nextLow=pts[k];
          if(nextHigh&&nextLow) break;
        }
      }
      if(nextHigh){ $("nextHighV").textContent=nextHigh.v.toFixed(1);
        $("nextHighT").textContent=fmt12(nextHigh.t.slice(11,16)); }
      if(nextLow){ $("nextLowV").textContent=nextLow.v.toFixed(1);
        $("nextLowT").textContent=fmt12(nextLow.t.slice(11,16)); }
    });
  }

  function loadWx(){
    var url="https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+
      "&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m"+
      "&daily=sunrise,sunset&temperature_unit=fahrenheit&wind_speed_unit=mph"+
      "&timezone="+encodeURIComponent(TZ);
    return fetch(url).then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){
      var c=d.current;
      $("airT").textContent=Math.round(c.temperature_2m)+"°F";
      $("sky").textContent=WMO[c.weather_code]||"–";
      $("wind").textContent=Math.round(c.wind_speed_10m)+" "+compass(c.wind_direction_10m);
      if(d.daily&&d.daily.sunrise){
        $("sun").textContent=fmt12(d.daily.sunrise[0].slice(11,16))+" / "+fmt12(d.daily.sunset[0].slice(11,16));
      }
    });
  }

  function loadMarine(){
    var url="https://marine-api.open-meteo.com/v1/marine?latitude="+LAT+"&longitude="+LON+
      "&current=wave_height,sea_surface_temperature&temperature_unit=fahrenheit"+
      "&timezone="+encodeURIComponent(TZ);
    return fetch(url).then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){
      var c=d.current;
      if(c.wave_height!=null) $("waves").textContent=c.wave_height.toFixed(1)+" ft";
      if(c.sea_surface_temperature!=null) $("waterT").textContent=Math.round(c.sea_surface_temperature)+"°F";
    });
  }

  function refresh(){
    $("errBox").innerHTML="";
    var stamp=new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"}).format(new Date());
    $("asof").textContent="as of "+stamp;
    var jobs=[loadTide(),loadWx(),loadMarine()];
    Promise.all(jobs.map(function(p){return p.catch(function(){return "e";});}))
      .then(function(rs){
        if(rs.every(function(x){return x==="e";})) fail("Couldn't reach tide or weather data.");
        else if(rs.some(function(x){return x==="e";})) fail("Some data didn't load — showing what we got.");
      });
  }

  refresh();
  setInterval(refresh, 10*60*1000);
})();
</script>
</body>
</html>
